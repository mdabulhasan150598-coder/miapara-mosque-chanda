name: Build Mosque APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup & Build Fresh Project
        run: |
          cd ..
          flutter create miapara_project --org com.miapara.chanda
          cd miapara_project
          
          # প্রয়োজনীয় প্যাকেজ যুক্ত করা
          flutter pub add sqflite path intl
          
          # আমাদের তৈরি main.dart ফাইলটি কপি করে বসানো
          cp $GITHUB_WORKSPACE/main.dart lib/main.dart
          
          # রিলিজ এপিকে তৈরি
          flutter build apk --release --no-tree-shake-icons
          
          # এপিকে আউটপুট ফোল্ডারে সরানো
          mkdir -p $GITHUB_WORKSPACE/output
          cp build/app/outputs/flutter-apk/app-release.apk $GITHUB_WORKSPACE/output/miapara-chanda.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: miapara-masjid-chanda-apk
          path: output/miapara-chanda.apk
