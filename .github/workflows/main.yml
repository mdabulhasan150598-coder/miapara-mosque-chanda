name: Build Mosque APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Auto-Detect File and Build APK
        run: |
          echo "Searching for main.dart..."
          TARGET_FILE=""
          if [ -f "$GITHUB_WORKSPACE/main.dart" ]; then
            TARGET_FILE="$GITHUB_WORKSPACE/main.dart"
            echo "Found main.dart in root directory"
          elif [ -f "$GITHUB_WORKSPACE/lib/main.dart" ]; then
            TARGET_FILE="$GITHUB_WORKSPACE/lib/main.dart"
            echo "Found main.dart in lib directory"
          else
            echo "Error: main.dart file not found!"
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi

          cd ..
          rm -rf miapara_project
          flutter create miapara_project --org com.miapara.chanda
          cd miapara_project

          flutter pub add sqflite path intl

          cp "$TARGET_FILE" lib/main.dart

          flutter build apk --release --no-tree-shake-icons

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/output/miapara-chanda.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: miapara-masjid-chanda-apk
          path: output/miapara-chanda.apk